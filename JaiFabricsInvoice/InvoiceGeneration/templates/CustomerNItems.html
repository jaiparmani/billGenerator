{% extends 'base.html' %}
{% block body_block %}
<div class="page-header">
  <h1>Bill details</h1>
  <p class="text-muted">Step 1 of 2 &mdash; who's this bill for, and how many items?</p>
</div>
<form action="{% url 'Form' %}" method="post">
    <table>
  {{CustForm.as_table}}
    </table>
  {%  csrf_token %}
  <input href= "{% url 'Form' %}" type="submit" name="" value="Continue">
</form>
<script>
  // The invoice number field arrives pre-filled with the suggested next
  // number (latest bill + 1). Select it on focus so tapping in and typing
  // replaces that suggestion instead of appending to it - without this,
  // a normal tap-and-type on mobile corrupts the invoice number.
  (function () {
    var field = document.getElementById('id_invoiceNumber');
    if (field) {
      field.addEventListener('focus', function () {
        this.select();
      });
    }
  })();

  // Native date inputs don't offer a one-tap "today" shortcut the way
  // the old admin calendar widget did - add one back.
  (function () {
    var dateField = document.getElementById('id_invoiceDate');
    if (!dateField) return;
    var todayLink = document.createElement('a');
    todayLink.href = '#';
    todayLink.className = 'date-today-link';
    todayLink.textContent = 'Today';
    todayLink.addEventListener('click', function (e) {
      e.preventDefault();
      var now = new Date();
      var mm = String(now.getMonth() + 1).padStart(2, '0');
      var dd = String(now.getDate()).padStart(2, '0');
      dateField.value = now.getFullYear() + '-' + mm + '-' + dd;
      dateField.dispatchEvent(new Event('change'));
    });
    dateField.insertAdjacentElement('afterend', todayLink);
  })();
</script>
{%endblock%}
